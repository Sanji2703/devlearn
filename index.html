<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <script>
      (function() {
        // AI Studio cloud preview environment runs without WebSocket HMR routing.
        // Provide a mock WebSocket for Vite HMR to prevent unhandled 'WebSocket closed without opened' errors.
        var RealWebSocket = window.WebSocket;
        if (RealWebSocket) {
          function MockViteWebSocket(url, protocols) {
            var protoStr = Array.isArray(protocols) ? protocols.join(',') : (protocols || '');
            var isViteHmr = protoStr.includes('vite-hmr') || protoStr.includes('vite-ping') || (typeof url === 'string' && (url.includes('vite-hmr') || url.includes('token=')));
            if (isViteHmr) {
              var target = new EventTarget();
              target.url = url;
              target.readyState = 1; // WebSocket.OPEN
              target.CONNECTING = 0;
              target.OPEN = 1;
              target.CLOSING = 2;
              target.CLOSED = 3;
              target.send = function() {};
              target.close = function() { target.readyState = 3; };
              setTimeout(function() {
                if (typeof target.onopen === 'function') target.onopen(new Event('open'));
                target.dispatchEvent(new Event('open'));
              }, 0);
              return target;
            }
            return new RealWebSocket(url, protocols);
          }
          MockViteWebSocket.prototype = RealWebSocket.prototype;
          MockViteWebSocket.CONNECTING = 0;
          MockViteWebSocket.OPEN = 1;
          MockViteWebSocket.CLOSING = 2;
          MockViteWebSocket.CLOSED = 3;
          window.WebSocket = MockViteWebSocket;
        }

        var origConsoleError = console.error;
        console.error = function() {
          var allArgs = Array.prototype.slice.call(arguments).map(function(a) {
            return (typeof a === 'string') ? a : (a && a.message ? a.message : String(a));
          }).join(' ');
          if (allArgs.includes('WebSocket') && (allArgs.includes('vite') || allArgs.includes('closed without opened'))) {
            return;
          }
          origConsoleError.apply(console, arguments);
        };

        window.addEventListener('unhandledrejection', function(event) {
          var reasonStr = String(event.reason || '');
          if (reasonStr.includes('WebSocket closed without opened') || reasonStr.includes('vite')) {
            event.stopImmediatePropagation();
            event.preventDefault();
          }
        }, true);

        window.addEventListener('error', function(event) {
          var msg = event.message || '';
          if (msg.includes('WebSocket closed without opened') || (event.filename && event.filename.includes('@vite/client'))) {
            event.stopImmediatePropagation();
            event.preventDefault();
            return true;
          }
        }, true);
      })();
    </script>
    <title>DevLearn - Assistant d'Apprentissage</title>
